<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16213e"><title>Mis 6 cartones Bingo</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f5f7fb;font:16px system-ui,sans-serif}header{position:sticky;top:0;background:#16213e;padding:12px;z-index:2;box-shadow:0 3px 12px #0005}h1{font-size:19px;margin:0 0 9px}.controls{display:flex;gap:7px;flex-wrap:wrap}input{font-size:20px;width:90px;padding:10px;border-radius:9px;border:0}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;background:#e4e9f4;color:#16213e}button.primary{background:#2ecc71;color:#082215}.status{font-size:13px;margin-top:7px;color:#c7d2e4}.cards{padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}.card{background:#fff;color:#19243a;border-radius:13px;padding:10px}.card h2{margin:0 0 7px;font-size:18px;display:flex;justify-content:space-between}.card h2 small{font-size:12px;color:#17653b}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.cell{aspect-ratio:1;display:grid;place-items:center;background:#e9eef6;border-radius:5px;font-weight:800;font-size:clamp(16px,5vw,25px);cursor:pointer}.cell.marked{background:#36b86a;color:white}.cell.free{background:#b8c5db;color:#263b61;font-size:11px}.heads{background:#243c68;color:#fff;font-size:19px}.last{padding:0 12px 12px;color:#bdc8dd;font-size:13px}#notice{font-size:13px;margin-top:6px;color:#ffe29a}</style></head><body><header><h1>🎱 Mis 6 cartones</h1><div class="controls"><input id="num" type="number" min="1" max="75" placeholder="1–75" inputmode="numeric"><button class="primary" id="mark">Marcar</button><button id="undo">Deshacer</button><button id="reset">Reiniciar</button></div><div class="status" id="status"></div><div id="notice"></div></header><main class="cards" id="cards"></main><div class="last" id="history"></div><script>
const cards={
'1482':[[7,22,37,50,75],[9,16,40,55,74],[15,29,0,56,73],[11,27,45,52,62],[2,21,36,57,66]],
'1484':[[13,20,36,52,72],[9,30,38,53,71],[1,19,0,56,65],[8,16,34,57,63],[7,25,40,60,70]],
'1486':[[1,18,41,58,72],[15,20,39,46,64],[9,22,0,52,67],[13,28,33,51,69],[11,16,40,56,71]],
'1488':[[12,27,31,46,62],[2,18,42,55,67],[3,21,0,51,66],[10,30,32,50,65],[5,25,44,58,71]],
'1489':[[14,21,39,54,66],[2,26,38,48,64],[10,16,0,50,74],[6,25,37,56,67],[12,28,36,49,73]],
'1490':[[7,18,43,53,62],[5,17,34,47,66],[4,16,0,49,61],[15,19,39,60,69],[3,27,45,58,74]]};
let history=[];try{history=JSON.parse(localStorage.getItem('bingo75-marcados')||'[]')}catch{};history=history.filter(n=>Number.isInteger(n)&&n>=1&&n<=75);const $=id=>document.getElementById(id);function persist(){localStorage.setItem('bingo75-marcados',JSON.stringify(history));render()}function wins(grid){const yes=n=>n===0||history.includes(n);let lines=[];for(let i=0;i<5;i++){if(grid[i].every(yes))lines.push('fila '+(i+1));if(grid.every(row=>yes(row[i])))lines.push('columna '+(i+1))}if(grid.every((row,i)=>yes(row[i])))lines.push('diagonal');if(grid.every((row,i)=>yes(row[4-i])))lines.push('diagonal');return lines}function render(){let completed=[];$('cards').innerHTML=Object.entries(cards).map(([id,grid])=>{let w=wins(grid);if(w.length)completed.push(id+' ('+w.join(', ')+')');return `<section class="card"><h2>Cartón ${id}<small>${w.length?'🎉 '+w.length+' línea(s)':''}</small></h2><div class="board">${'BINGO'.split('').map(x=>`<div class="cell heads">${x}</div>`).join('')}${grid.flat().map(n=>`<div class="cell ${n===0?'free':history.includes(n)?'marked':''}" data-n="${n}">${n||'LIBRE'}</div>`).join('')}</div></section>`}).join('');$('status').textContent=`${history.length} números marcados · Último: ${history.at(-1)||'ninguno'}`;$('history').textContent='Números cantados: '+(history.join(', ')||'ninguno');$('notice').textContent=completed.length?'¡Línea completa! '+completed.join(' · '):''}function mark(){let n=Number($('num').value);if(!Number.isInteger(n)||n<1||n>75){alert('Ingresa un número del 1 al 75');return}if(!history.includes(n))history.push(n);$('num').value='';persist();$('num').focus()}$('mark').onclick=mark;$('num').onkeydown=e=>{if(e.key==='Enter')mark()};$('undo').onclick=()=>{history.pop();persist()};$('reset').onclick=()=>{if(confirm('¿Borrar todos los números marcados?')){history=[];persist()}};$('cards').onclick=e=>{let el=e.target.closest('[data-n]');if(!el)return;let n=Number(el.dataset.n);if(!n)return;history=history.includes(n)?history.filter(x=>x!==n):[...history,n];persist()};render();</script></body></html>
